<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Region / Area / County Map Viewer</title>
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  #layout { display: flex; height: 100%; position: relative; }
  #sidebar {
    width: 300px; flex-shrink: 0; background: #1e2a38; color: #eef2f7;
    padding: 16px; overflow-y: auto; box-sizing: border-box;
  }
  #sidebar h1 { font-size: 18px; margin: 0 0 4px; }
  #sidebar p.hint { font-size: 12px; color: #9fb0c3; margin: 0 0 16px; }
  #csv-input-row { margin-bottom: 16px; }
  #csv-file { width: 100%; font-size: 13px; color: #eef2f7; }
  #status { font-size: 13px; color: #9fb0c3; margin-bottom: 16px; min-height: 18px; }
  .region-block { margin-bottom: 14px; }
  .region-header {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 3px 4px; border-radius: 4px; margin-bottom: 4px;
  }
  .region-header:hover { background: rgba(255,255,255,0.08); }
  .region-header.active { background: rgba(255,255,255,0.18); color: #ffffff; }
  .region-arrow {
    width: 0; height: 0; flex-shrink: 0; margin: 0 2px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid #9fb0c3;
    transition: transform 0.15s ease;
  }
  .region-arrow.collapsed { transform: rotate(-90deg); }
  .region-title { font-weight: 600; font-size: 14px; flex: 1; }
  .region-areas { overflow: hidden; }
  .region-areas.collapsed { display: none; }
  .area-row {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    padding: 3px 4px; cursor: pointer; border-radius: 4px;
  }
  .area-row:hover { color: #ffffff; background: rgba(255,255,255,0.08); }
  .area-row.active { background: rgba(255,255,255,0.18); color: #ffffff; font-weight: 600; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); }
  #clear-selection-row { margin-bottom: 12px; }
  #clear-selection-btn {
    font-size: 12px; background: #33495f; color: #eef2f7; border: none;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; display: none;
  }
  #clear-selection-btn:hover { background: #405a74; }
  #auth-section { margin-bottom: 16px; border-bottom: 1px solid #33495f; padding-bottom: 14px; }
  #auth-logged-out input {
    width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 7px 8px;
    border-radius: 4px; border: 1px solid #33495f; background: #16202b;
    color: #eef2f7; font-size: 13px;
  }
  #auth-buttons-row { display: flex; gap: 6px; margin-bottom: 6px; }
  #auth-buttons-row button {
    flex: 1; font-size: 12px; background: #33495f; color: #eef2f7; border: none;
    padding: 7px 6px; border-radius: 4px; cursor: pointer;
  }
  #auth-buttons-row button:hover { background: #405a74; }
  #auth-error { font-size: 12px; color: #ff6b6b; min-height: 16px; }
  #auth-logged-in { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #auth-user-email { font-size: 12px; color: #cfdcea; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #auth-logout-btn {
    font-size: 12px; background: #33495f; color: #eef2f7; border: none;
    padding: 6px 10px; border-radius: 4px; cursor: pointer; flex-shrink: 0;
  }
  #auth-logout-btn:hover { background: #405a74; }
  #saved-maps-section { margin: 14px 0; border-top: 1px solid #33495f; padding-top: 12px; }
  #saved-maps-header { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #cfdcea; }
  .saved-map-row {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    padding: 4px 4px; border-radius: 4px;
  }
  .saved-map-row:hover { background: rgba(255,255,255,0.06); }
  .saved-map-row.active { background: rgba(255,255,255,0.16); }
  .saved-map-name { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-map-delete {
    background: none; border: none; color: #9fb0c3; cursor: pointer;
    font-size: 14px; padding: 0 4px;
  }
  .saved-map-delete:hover { color: #ff6b6b; }
  #no-saved-maps { font-size: 12px; color: #6f8399; font-style: italic; }
  #map { flex: 1; }
  #info-window-content { font-size: 13px; }
  #info-window-content b { display: block; margin-bottom: 2px; }

  #sidebar-toggle-btn {
    display: none; position: absolute; top: 12px; left: 12px; z-index: 20;
    width: 44px; height: 44px; border-radius: 8px; border: none;
    background: #1e2a38; color: #eef2f7; font-size: 20px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); align-items: center; justify-content: center;
  }
  #sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 15;
  }

  /* Floating confirmation that appears over the MAP (not the sidebar)
     whenever a region/area is selected -- on mobile the sidebar drawer
     auto-closes right after selecting something, so without this
     there'd be no visible sign of what got selected until reopening
     the drawer. Shown on all screen sizes since it's useful context on
     desktop too, just especially needed on mobile. */
  #selection-banner {
    display: none; position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%); z-index: 20;
    background: #1e2a38; color: #eef2f7; padding: 8px 8px 8px 14px;
    border-radius: 20px; font-size: 13px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    align-items: center; gap: 8px; max-width: 80vw;
  }
  #selection-banner.open { display: flex; }
  #selection-banner-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #selection-banner-close {
    background: rgba(255,255,255,0.12); border: none; color: #eef2f7;
    font-size: 16px; line-height: 1; cursor: pointer; padding: 4px 8px;
    border-radius: 50%; flex-shrink: 0;
  }
  #selection-banner-close:hover { background: rgba(255,255,255,0.22); }

  /* Phone-sized screens: sidebar becomes a slide-in drawer over the
     map instead of taking permanent horizontal space, and touch
     targets get bigger. */
  @media (max-width: 700px) {
    #sidebar-toggle-btn { display: flex; }
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
      width: 85vw; max-width: 340px;
      transform: translateX(-100%);
      transition: transform 0.2s ease-out;
      padding-top: 64px;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }

    #csv-file { padding: 8px 0; }
    button, .area-row, .region-header, .saved-map-row {
      min-height: 40px;
    }
    #my-location-btn { padding: 12px 10px !important; font-size: 14px !important; }
    .area-row, .region-title { font-size: 15px !important; }
    .saved-map-delete { font-size: 20px !important; padding: 4px 10px !important; }
  }
</style>
</head>
<body>
<div id="layout">
  <button id="sidebar-toggle-btn" aria-label="Toggle menu">&#9776;</button>
  <div id="sidebar-overlay"></div>
  <div id="sidebar">
    <h1>Region / Area / County Map</h1>
    <p class="hint">Load one or more CSVs (pick several at once, or click multiple saved maps below) -- everything loaded shows together. Click a region or area below to highlight and zoom to it.</p>

    <div id="auth-section">
      <div id="auth-logged-out">
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
        <div id="auth-buttons-row">
          <button id="auth-login-btn">Log In</button>
          <button id="auth-signup-btn">Sign Up</button>
        </div>
        <div id="auth-error"></div>
      </div>
      <div id="auth-logged-in" style="display:none;">
        <div id="auth-user-email"></div>
        <button id="auth-logout-btn">Log Out</button>
      </div>
    </div>

    <div id="csv-input-row">
      <input type="file" id="csv-file" accept=".csv" multiple>
    </div>
    <div id="status">No CSV loaded yet.</div>
    <div id="sync-error-status" style="font-size: 12px; color: #ff6b6b; margin-bottom: 8px;"></div>
    <div id="loaded-sources-section" style="margin-bottom: 16px;">
      <div id="loaded-sources-list"></div>
      <button id="clear-loaded-sources-btn" style="display:none; font-size: 12px; background: #33495f; color: #eef2f7; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 4px;">Clear all loaded files</button>
    </div>

    <div id="saved-maps-section">
      <div id="saved-maps-header">Saved Maps (click to add to map)</div>
      <div id="saved-maps-list"></div>
    </div>

    <div id="clear-selection-row">
      <button id="clear-selection-btn">Show all (clear selection)</button>
    </div>
    <div id="marker-toggle-row" style="font-size: 13px; margin-bottom: 12px;">
      <label>
        <input type="checkbox" id="marker-toggle" checked>
        Show repeater locations (needs GPS data in the CSV)
      </label>
    </div>
    <div id="my-location-row" style="margin-bottom: 12px;">
      <button id="my-location-btn" style="font-size: 12px; background: #33495f; color: #eef2f7; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; width: 100%;">
        Find My Location
      </button>
      <div id="my-location-status" style="font-size: 12px; color: #9fb0c3; margin-top: 4px;"></div>
      <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 8px; cursor: pointer;">
        <input type="checkbox" id="location-watch-toggle">
        Notify me when I enter a new area/region
      </label>
      <div id="location-watch-status" style="font-size: 12px; color: #9fb0c3; margin-top: 4px;"></div>
    </div>
    <div id="region-list"></div>
  </div>
  <div id="map"></div>
  <div id="selection-banner">
    <span id="selection-banner-text"></span>
    <button id="selection-banner-close" aria-label="Clear selection">&times;</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script>
// ---------------------------------------------------------------------
// FIPS state-code -> two-letter abbreviation, used to match the public
// county-boundaries GeoJSON (which identifies counties by FIPS codes)
// against your CSV's plain "state" column (e.g. "AL", "TN").
// ---------------------------------------------------------------------
const FIPS_TO_STATE = {
  "01":"AL","02":"AK","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT",
  "10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID","17":"IL",
  "18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD",
  "25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE",
  "32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND",
  "39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD",
  "47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV",
  "55":"WI","56":"WY","72":"PR"
};

const COUNTIES_GEOJSON_URL =
  "https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json";

// Normalizes a county name for matching: lowercase, strip "county"/
// "parish"/"borough" suffixes and punctuation, trim whitespace.
function normalizeCountyName(name) {
  return (name || "")
    .toLowerCase()
    .replace(/\bcounty\b/g, "")
    .replace(/\bparish\b/g, "")
    .replace(/\bborough\b/g, "")
    .replace(/[^a-z ]/g, "")
    .trim();
}

function matchKey(countyName, stateAbbr) {
  return normalizeCountyName(countyName) + "|" + (stateAbbr || "").toUpperCase().trim();
}

let map;
let countiesLayer;
// A SEPARATE Data layer, added on top of countiesLayer, that holds one
// dissolved (outer-boundary-only) polygon per multi-area -- see
// renderMultiAreaOutlines(). Kept apart from countiesLayer because a
// per-county style can only ever draw per-county edges; a multi-area
// spanning several counties needs its OWN merged shape to get a single
// clean outline instead of a bold line on every internal county border.
let multiAreaLayer;
// key: "normalizedcounty|ST" -> raw GeoJSON feature (from the counties
// source data, kept alongside what's loaded into countiesLayer) so
// renderMultiAreaOutlines() can turf.dissolve() the right counties
// without a second network fetch.
let countyFeaturesByKey = {};
// multi-area name -> its color, set by renderMultiAreaOutlines() and
// read back by applyStyling() when re-styling multiAreaLayer on
// selection change.
let multiAreaColorByName = {};
// multi-area name -> Set of every region it's linked to across ALL
// loaded CSVs. A multi-area like Chattanooga TN can genuinely appear in
// more than one region's export file (it's linked to both East TN and
// North AL Central TN Chatt, say) -- when that happens it doesn't
// cleanly "belong" to just one region's collapse, so restyleMultiAreaLayer()
// treats anything with more than one entry here as always-true-color
// (see multiAreaLinkedToMultipleRegions below) rather than guessing
// which single region's unified color it should blend into.
let multiAreaRegionsByName = {};
let multiAreaLinkedToMultipleRegions = {};
// multi-area name -> true if ANY of its counties also belong to a real
// member area of a region (i.e. it's genuinely "part of" that region,
// as opposed to a fully standalone multi-area with nothing underneath
// it anywhere). Both set by renderMultiAreaOutlines().
let multiAreaHasRegionOverlap = {};
// key: "normalizedcounty|ST" -> { area, region, color }
let csvLookup = {};
// region -> { area -> color }
let regionAreaColors = {};
// region -> single unified color for that region -- used for every one
// of its areas whenever a DIFFERENT region/area is selected, so other
// regions read as one solid color instead of their individual per-area
// colors (which are reserved for whichever region is actually focused).
// Recomputed in rebuildFromSources() any time the loaded set changes.
let regionColorByName = {};
// The same jewel-tone palette region_picker.py's own AREA_COLORS uses,
// for a consistent look between the desktop app's map and this one.
// An earlier version deliberately used a different, brighter palette
// here to dodge collisions with individual area colors -- that's no
// longer needed now that the actual sources of collision are fixed at
// the root: region_picker.py assigns each area/multi-area a genuinely
// unique, persisted color (see _stable_web_app_color), and the picker
// below also greedily maximizes color DISTANCE from whatever's already
// in use (not just avoiding exact matches), so reverting to this
// palette is safe.
const REGION_COLOR_PALETTE = [
  "#25347E", "#4E7E25", "#7E2569", "#257E7A", "#7E6025", "#46257E",
  "#257E2C", "#7E2538", "#25527E", "#6C7E25", "#76257E", "#257E5C",
  "#7E4225", "#28257E", "#3C7E25", "#7E2556", "#25707E", "#7E7325",
  "#58257E", "#257E3E", "#7E2525", "#25407E", "#5A7E25", "#7E2574",
];
function hexToRgb(hex) {
  const h = hex.replace("#", "");
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
// Plain Euclidean RGB distance -- not perceptually exact, but more than
// good enough to reliably tell "these two dark blues look the same" from
// "these two colors look different", which is all this needs.
function colorDistance(hexA, hexB) {
  const [r1, g1, b1] = hexToRgb(hexA);
  const [r2, g2, b2] = hexToRgb(hexB);
  return Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
}
// { type: "region"|"area", name: string } or null for no selection
let selection = null;
let repeaterMarkers = [];
let showMarkers = true;

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 37.8, lng: -96 },
    zoom: 5,
    mapTypeControl: false,
    streetViewControl: false,
  });

  countiesLayer = new google.maps.Data({ map });
  multiAreaLayer = new google.maps.Data({ map });

  fetch(COUNTIES_GEOJSON_URL)
    .then((r) => r.json())
    .then((geojson) => {
      for (const feature of geojson.features) {
        const stateFips = feature.properties.STATE;
        const countyName = feature.properties.NAME;
        const stateAbbr = FIPS_TO_STATE[stateFips];
        const key = matchKey(countyName, stateAbbr);
        countyFeaturesByKey[key] = feature;
      }
      countiesLayer.addGeoJson(geojson);
      applyStyling();
      renderMultiAreaOutlines();
    });

  countiesLayer.addListener("click", (event) => {
    showInfoForFeature(event);
  });
}

// Builds one dissolved (interior-boundaries-removed) outline per
// multi-area name, so a multi-area spanning many counties reads as a
// single clean border instead of a bold-colored line repeated on every
// county-to-county edge inside it. Called after every CSV load.
function renderMultiAreaOutlines() {
  multiAreaLayer.forEach((f) => multiAreaLayer.remove(f));
  if (Object.keys(countyFeaturesByKey).length === 0) return;

  // Group counties by multi-area name (not by region -- the same
  // multi-area can be linked to more than one region and appear as
  // separate CSV rows, but its shape is the same either way).
  const countiesByMultiArea = {};
  multiAreaColorByName = {};
  multiAreaRegionsByName = {};
  multiAreaLinkedToMultipleRegions = {};
  multiAreaHasRegionOverlap = {};
  for (const key in csvLookup) {
    const entries = csvLookup[key];
    const areaMatch = entries.find((m) => m.type === "area");
    for (const m of entries) {
      if (m.type !== "multiarea") continue;
      if (!countiesByMultiArea[m.area]) countiesByMultiArea[m.area] = new Set();
      countiesByMultiArea[m.area].add(key);
      multiAreaColorByName[m.area] = m.color;
      if (!multiAreaRegionsByName[m.area]) multiAreaRegionsByName[m.area] = new Set();
      multiAreaRegionsByName[m.area].add(m.region);
      multiAreaLinkedToMultipleRegions[m.area] = multiAreaRegionsByName[m.area].size > 1;
      if (areaMatch) multiAreaHasRegionOverlap[m.area] = true;
    }
  }

  for (const areaName in countiesByMultiArea) {
    const polygons = [];
    for (const key of countiesByMultiArea[areaName]) {
      const feature = countyFeaturesByKey[key];
      if (!feature) continue;
      // turf.dissolve only accepts Polygon features, so split any
      // MultiPolygon county (e.g. one with small islands) into its
      // individual parts first -- they'll still merge correctly with
      // their neighbors on shared edges.
      if (feature.geometry.type === "MultiPolygon") {
        for (const coords of feature.geometry.coordinates) {
          polygons.push(turf.polygon(coords, { grp: areaName }));
        }
      } else if (feature.geometry.type === "Polygon") {
        polygons.push(turf.polygon(feature.geometry.coordinates, { grp: areaName }));
      }
    }
    if (polygons.length === 0) continue;

    let merged;
    try {
      merged = polygons.length === 1
        ? polygons[0]
        : turf.dissolve(turf.featureCollection(polygons), { propertyName: "grp" });
    } catch (e) {
      // Dissolve can fail on messy/adjacent-but-not-snapped source
      // geometry -- fall back to just adding the un-merged county
      // polygons rather than losing the outline entirely.
      console.warn("Could not dissolve multi-area outline for", areaName, e);
      merged = turf.featureCollection(polygons);
    }

    const mergedFeatures = merged.type === "FeatureCollection" ? merged.features : [merged];
    for (const mf of mergedFeatures) {
      // Ensure "grp" survives regardless of exactly how turf.dissolve
      // (or the fallback path) populated properties, since later code
      // reads it back via feature.getProperty("grp") to look up color.
      mf.properties = Object.assign({}, mf.properties, { grp: areaName });
      multiAreaLayer.addGeoJson({ type: "FeatureCollection", features: [mf] });
    }
  }

  restyleMultiAreaLayer();
}

function featureStyle(feature) {
  const stateFips = feature.getProperty("STATE");
  const countyName = feature.getProperty("NAME");
  const stateAbbr = FIPS_TO_STATE[stateFips];
  const key = matchKey(countyName, stateAbbr);
  const matches = csvLookup[key];

  if (!matches || matches.length === 0) {
    return {
      fillColor: "#cccccc",
      fillOpacity: 0.0,
      strokeColor: "#999999",
      strokeWeight: 0.3,
      clickable: false,
    };
  }

  // The regular area (if any) always provides the FILL -- a Multi
  // Area/Region entry deliberately overlaps a regular area's own
  // counties, so it must never hide the area underneath it. If this
  // county belongs ONLY to a multi-area (no regular area claims it), it
  // gets NO fill at all -- a multi-area is represented purely by its
  // outline (see multiAreaLayer/restyleMultiAreaLayer), never a solid
  // color of its own on the county layer, even where nothing else is
  // underneath it.
  const areaMatch = matches.find((m) => m.type === "area");
  const multiMatch = matches.find((m) => m.type === "multiarea");

  if (!areaMatch) {
    // Only a multi-area (or nothing) claims this county -- leave the
    // fill layer blank; multiAreaLayer draws its outline independently
    // on top, which is the only visual this county should get from it.
    return {
      fillColor: "#cccccc",
      fillOpacity: 0.0,
      strokeColor: "#999999",
      strokeWeight: 0.3,
      clickable: !!multiMatch,
    };
  }
  const fillMatch = areaMatch;

  // A REGION selection now DOES expand into its areas' individual
  // colors again -- selecting "North AL Central TN Chatt" reveals
  // Culman AL, Gadsden AL, North AL, etc. each in their own true color,
  // matching the sidebar's own legend for it. Every OTHER loaded region
  // (or this region when nothing at all is selected) still collapses to
  // its single unified color -- that part stays exactly as it was.
  //
  // Checked ONLY against fillMatch (the real area), never against
  // every entry in `matches` -- that used to include a MULTI-AREA row
  // sharing this county, and a multi-area's own region tag (e.g.
  // Chattanooga TN tagged "North AL Central TN Chatt" in one of its two
  // files) has nothing to do with whether the REAL underlying area
  // (say, East TN's own SE TN) should be considered selected. That was
  // exactly what let SE TN's true color bleed through East TN's unified
  // color whenever North AL Central TN Chatt was selected, purely
  // because they happened to share a county via Chattanooga TN.
  const isAreaSelected = !!(selection && selection.type === "area" && fillMatch.area === selection.name);
  const isRegionSelected = !!(selection && selection.type === "region" && fillMatch.region === selection.name);
  const isSelected = isAreaSelected || isRegionSelected;

  const displayColor = isSelected ? fillMatch.color : (regionColorByName[fillMatch.region] || fillMatch.color);
  return {
    fillColor: displayColor,
    fillOpacity: isSelected ? 0.75 : 0.55,
    strokeColor: displayColor,
    strokeWeight: isSelected ? 2 : 1,
    clickable: true,
  };
}

function applyStyling() {
  if (!countiesLayer) return;
  countiesLayer.forEach((feature) => {
    countiesLayer.overrideStyle(feature, featureStyle(feature));
  });

  restyleMultiAreaLayer();
}

// A multi-area's outline ALWAYS shows its own true, consistent color
// (e.g. Chattanooga TN is always brown) -- it no longer tries to blend
// into whichever region's unified color it happens to sit near when
// that region isn't focused. That blending logic kept creating new
// collisions no matter how the region-color picking was tuned (a
// region's unified color landing near some multi-area's true color,
// or being ambiguous entirely for a multi-area linked to more than one
// region, like Chattanooga TN appearing in both East TN's and North AL
// Central TN Chatt's export files). Always-true-color sidesteps all of
// that: the outline means the same thing everywhere on the map, all
// the time, regardless of any selection. Selecting the multi-area
// itself still bumps the stroke weight up further for emphasis.
function restyleMultiAreaLayer() {
  if (!multiAreaLayer) return;
  multiAreaLayer.forEach((feature) => {
    const areaName = feature.getProperty("grp");
    const isDirectlySelected = !!(selection && selection.type === "area" && selection.name === areaName);
    multiAreaLayer.overrideStyle(feature, {
      fillOpacity: 0,
      strokeColor: multiAreaColorByName[areaName] || "#000000",
      strokeWeight: isDirectlySelected ? 5 : 4,
      clickable: false,
    });
  });
}

let lastRepeaterPoints = [];

function renderRepeaterMarkers(points) {
  if (points) lastRepeaterPoints = points;

  for (const marker of repeaterMarkers) marker.setMap(null);
  repeaterMarkers = [];

  if (!showMarkers) return;

  for (const point of lastRepeaterPoints) {
    if (selection) {
      const matches = (selection.type === "region" && point.region === selection.name) ||
        (selection.type === "area" && point.area === selection.name);
      if (!matches) continue;
    }

    const marker = new google.maps.Marker({
      position: { lat: point.lat, lng: point.lon },
      map,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 5,
        fillColor: point.color,
        fillOpacity: 0.9,
        strokeColor: "#1e2a38",
        strokeWeight: 1,
      },
      title: (point.name || "Repeater") + " -- " + point.freq + " MHz",
    });

    const infoWindow = new google.maps.InfoWindow({
      content: '<div id="info-window-content"><b>' + (point.name || "Repeater") + "</b>" +
        point.freq + " MHz<br>Area: " + point.area + "<br>Region: " + point.region + "</div>",
    });
    marker.addListener("click", () => infoWindow.open(map, marker));

    repeaterMarkers.push(marker);
  }
}

// ---------------------------------------------------------------------
// "Find My Location": uses the browser's geolocation, drops a marker,
// then figures out which county that point falls inside of (via
// point-in-polygon testing against the loaded county boundaries) and
// auto-selects/highlights that county's area on the map -- same
// highlight behavior as clicking an area in the sidebar.
// ---------------------------------------------------------------------
let myLocationMarker = null;

function polygonRingContainsPoint(dataPolygon, point) {
  // dataPolygon is a google.maps.Data.Polygon: getArray() -> LinearRing[].
  // Only the outer ring is checked (ring 0) -- county boundaries in this
  // dataset don't have holes, so inner rings aren't relevant here.
  const rings = dataPolygon.getArray();
  if (!rings.length) return false;
  const outerRingPath = rings[0].getArray();
  const tempPolygon = new google.maps.Polygon({ paths: outerRingPath });
  return google.maps.geometry.poly.containsLocation(point, tempPolygon);
}

function geometryContainsPoint(geometry, point) {
  const type = geometry.getType();
  if (type === "Polygon") {
    return polygonRingContainsPoint(geometry, point);
  }
  if (type === "MultiPolygon") {
    let contains = false;
    geometry.getArray().forEach((poly) => {
      if (!contains && polygonRingContainsPoint(poly, point)) contains = true;
    });
    return contains;
  }
  return false;
}

function findCountyKeyAtPoint(latLng) {
  let foundKey = null;
  countiesLayer.forEach((feature) => {
    if (foundKey) return;
    if (geometryContainsPoint(feature.getGeometry(), latLng)) {
      const stateFips = feature.getProperty("STATE");
      const countyName = feature.getProperty("NAME");
      const stateAbbr = FIPS_TO_STATE[stateFips];
      foundKey = { key: matchKey(countyName, stateAbbr), countyName, stateAbbr };
    }
  });
  return foundKey;
}

function findMyLocation() {
  const statusEl = document.getElementById("my-location-status");
  if (!navigator.geolocation) {
    statusEl.textContent = "Geolocation isn't supported in this browser.";
    return;
  }
  statusEl.textContent = "Finding your location...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const latLng = new google.maps.LatLng(
        position.coords.latitude, position.coords.longitude);

      if (myLocationMarker) myLocationMarker.setMap(null);
      myLocationMarker = new google.maps.Marker({
        position: latLng,
        map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: "#ff3b30",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2,
        },
        title: "You are here",
        zIndex: 999,
      });

      map.panTo(latLng);
      map.setZoom(10);

      if (!countiesLayer) {
        statusEl.textContent = "County boundaries haven't finished loading yet -- try again in a moment.";
        return;
      }

      const found = findCountyKeyAtPoint(latLng);
      if (!found) {
        statusEl.textContent = "Located you, but couldn't match this to a loaded county boundary.";
        return;
      }

      const matches = csvLookup[found.key];
      if (!matches || matches.length === 0) {
        statusEl.textContent = "You're in " + found.countyName + " County, " + found.stateAbbr +
          " -- not part of any loaded area.";
        return;
      }
      const match = matches.find((m) => m.type === "area") || matches[0];
      const multiMatch = matches.find((m) => m.type === "multiarea");

      statusEl.textContent = "You're in " + found.countyName + " County, " + found.stateAbbr +
        " -- Area: " + match.area + ", Region: " + match.region +
        (multiMatch ? " (also in Multi Area/Region: " + multiMatch.area + ")" : "");
      selectArea(match.area);
    },
    (error) => {
      statusEl.textContent = "Couldn't get your location (" + error.message + ").";
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

document.getElementById("my-location-btn").addEventListener("click", findMyLocation);

// ---------------------------------------------------------------------
// "Notify me when I enter a new area/region": a continuous version of
// Find My Location -- watches GPS position and, whenever the point moves
// into a county belonging to a DIFFERENT loaded area or region than the
// last one it was in, surfaces that both on-page and (if permitted) as
// a real browser notification. Off by default (continuous high-accuracy
// GPS is a battery cost the person should opt into).
// ---------------------------------------------------------------------
let locationWatchId = null;
let lastWatchedAreaKey = null;   // countyKey last matched, so pure GPS
                                  // jitter within the same county doesn't
                                  // re-fire the notification every ping
let lastWatchedAreaName = null;
let lastWatchedRegionName = null;

function announceAreaChange(text) {
  const statusEl = document.getElementById("location-watch-status");
  statusEl.textContent = text;
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try {
      new Notification("Region / Area Map", { body: text });
    } catch (e) {
      // Some browsers (notably iOS Safari) support the permission
      // prompt but throw on `new Notification(...)` outside a service
      // worker -- the on-page status text above already covers it, so
      // just swallow this rather than breaking the position callback.
      console.warn("Browser notification failed:", e);
    }
  }
}

function handleWatchPosition(position) {
  const latLng = new google.maps.LatLng(
    position.coords.latitude, position.coords.longitude);

  if (myLocationMarker) myLocationMarker.setMap(null);
  myLocationMarker = new google.maps.Marker({
    position: latLng,
    map,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 8,
      fillColor: "#ff3b30",
      fillOpacity: 1,
      strokeColor: "#ffffff",
      strokeWeight: 2,
    },
    title: "You are here",
    zIndex: 999,
  });

  if (!countiesLayer) return;
  const found = findCountyKeyAtPoint(latLng);
  const key = found ? found.key : null;
  if (key === lastWatchedAreaKey) return;  // same county as last ping -- no change
  lastWatchedAreaKey = key;

  if (!found) {
    document.getElementById("location-watch-status").textContent =
      "Watching your location...";
    return;
  }

  const matches = csvLookup[key];
  if (!matches || matches.length === 0) {
    document.getElementById("location-watch-status").textContent =
      "You're in " + found.countyName + " County, " + found.stateAbbr +
      " -- not part of any loaded area.";
    lastWatchedAreaName = null;
    lastWatchedRegionName = null;
    return;
  }

  const match = matches.find((m) => m.type === "area") || matches[0];
  const multiMatch = matches.find((m) => m.type === "multiarea");

  if (match.area !== lastWatchedAreaName || match.region !== lastWatchedRegionName) {
    let text = "Entered " + match.area + " (" + match.region + ")" +
      " -- " + found.countyName + " County, " + found.stateAbbr;
    if (multiMatch) text += ", also in " + multiMatch.area;
    announceAreaChange(text);
    lastWatchedAreaName = match.area;
    lastWatchedRegionName = match.region;

    // Surface the newly-entered area the same way tapping it would --
    // updates the map coloring, the sidebar's highlighted row, and the
    // floating "Area — Region" banner over the map, so it's visible at
    // a glance without needing to touch the phone while driving.
    // Deliberately does NOT fitBounds() to the whole area's shape like
    // a manual tap does -- re-fitting the zoom to a potentially huge
    // area's full extent every time a boundary is crossed would yank
    // the view around while driving. Instead it just gently recenters
    // on the current position, and only nudges the zoom level if it's
    // currently too far out to be useful for someone on the move.
    selection = { type: "area", name: match.area };
    applyStyling();
    renderSidebarList();
    renderRepeaterMarkers();
    document.getElementById("clear-selection-btn").style.display = "inline-block";
    renderSelectionBanner();
    map.panTo(latLng);
    if (map.getZoom() < 8) map.setZoom(10);
    // If the sidebar happened to be open (unlikely while driving, but
    // possible), close it so the highlighted map/banner are actually
    // visible instead of hidden behind the drawer.
    if (window.innerWidth <= 700) closeSidebar();
  }
}

function startLocationWatch() {
  const statusEl = document.getElementById("location-watch-status");
  if (!navigator.geolocation) {
    statusEl.textContent = "Geolocation isn't supported in this browser.";
    document.getElementById("location-watch-toggle").checked = false;
    return;
  }
  lastWatchedAreaKey = null;
  lastWatchedAreaName = null;
  lastWatchedRegionName = null;
  statusEl.textContent = "Watching your location...";

  if (typeof Notification !== "undefined" && Notification.permission === "default") {
    Notification.requestPermission();
  }

  locationWatchId = navigator.geolocation.watchPosition(
    handleWatchPosition,
    (error) => {
      statusEl.textContent = "Couldn't get your location (" + error.message + ").";
    },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}

function stopLocationWatch() {
  if (locationWatchId !== null) {
    navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId = null;
  }
  document.getElementById("location-watch-status").textContent = "";
}

document.getElementById("location-watch-toggle").addEventListener("change", (event) => {
  if (event.target.checked) {
    startLocationWatch();
  } else {
    stopLocationWatch();
  }
});

// Mobile drawer sidebar: hamburger button opens it, tapping the dark
// overlay behind it closes it again. On wider screens the sidebar is
// always visible and this button stays hidden via CSS, so none of this
// matters there.
function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebar-overlay").classList.add("open");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("open");
}
document.getElementById("sidebar-toggle-btn").addEventListener("click", openSidebar);
document.getElementById("sidebar-overlay").addEventListener("click", closeSidebar);

function showInfoForFeature(event) {
  const stateFips = event.feature.getProperty("STATE");
  const countyName = event.feature.getProperty("NAME");
  const stateAbbr = FIPS_TO_STATE[stateFips];
  const key = matchKey(countyName, stateAbbr);
  const matches = csvLookup[key];
  if (!matches || matches.length === 0) return;
  const match = matches.find((m) => m.type === "area") || matches[0];
  const multiMatch = matches.find((m) => m.type === "multiarea");

  const infoWindow = new google.maps.InfoWindow({
    content:
      '<div id="info-window-content"><b>' + countyName + " County, " + stateAbbr + "</b>" +
      "Area: " + match.area + "<br>" +
      "Region: " + match.region +
      (multiMatch ? "<br>Also in Multi Area/Region: " + multiMatch.area : "") + "</div>",
    position: event.latLng,
  });
  infoWindow.open(map);

  // Clicking a colored region directly on the map selects that region
  // the same way clicking its name in the sidebar does -- which reveals
  // (expands) its area list there. On mobile the sidebar drawer is
  // opened too, since that expanded area list is otherwise hidden
  // behind it -- tapping a region on the map is exactly the "show me
  // what's in this region" gesture the sidebar's own region click
  // handles, just triggered from the map side instead.
  selectRegion(match.region);
  if (window.innerWidth <= 700) openSidebar();
}

// Extracts "Cullman" and "AL" out of a CHIRP Comment field formatted as
// "SomeLocation / Cullman County, AL" (exactly how region_picker.py's
// CSV export writes it).
function parseCountyStateFromComment(comment) {
  const match = /\/\s*(.+?)\s+County,\s*([A-Za-z]{2})\s*$/.exec(comment || "");
  if (!match) return null;
  return { county: match[1].trim(), state: match[2].trim() };
}

// Every loaded CSV is kept as its own "source" ({id, name, text}) so more
// than one can be on the map at once -- picking additional files, or
// clicking more saved maps, ADDS to what's already shown instead of
// replacing it. Removing one source just re-parses whatever's left.
let loadedSources = [];
let sourceIdCounter = 0;
let allRepeaterPointsCache = [];

// Parses one CSV's text and MERGES its rows into the shared csvLookup /
// regionAreaColors (does not reset them -- that's rebuildFromSources()'s
// job, once, before looping over every currently-loaded source). Returns
// this source's own stats so rebuildFromSources() can total them up.
function parseCsvIntoState(text) {
  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });

  // Two supported formats:
  // 1. Simple: county,state,area,region,color,type (one row per county
  //    -- "type" is "area" for a regular area or "multiarea" for a
  //    Multi Area/Region entry, e.g. a repeater club's coverage that
  //    deliberately overlaps a regular area's own counties. Older
  //    exports (from before "type" existed) default every row to
  //    "area", same as before this distinction was added.
  // 2. Combined CHIRP export: has Area/Region/Color columns plus a
  //    Comment column embedding "... / County Name County, ST" (one row
  //    per repeater channel -- county/area/region repeat across rows,
  //    so we dedupe naturally by only keeping the first "area"-type
  //    row per county). No "type" column in this format -- everything
  //    is treated as a regular area, since this format predates Multi
  //    Area/Region support.
  //    May also have Lat/Lon columns (only populated when "Fetch exact
  //    offset splits" was used in region_picker.py, since that's the
  //    same detail-page fetch GPS coordinates piggyback on) -- when
  //    present, individual repeater markers get plotted too.
  const fields = parsed.meta.fields || [];
  const isChirpFormat = fields.includes("Area") && fields.includes("Region")
    && fields.includes("Color") && fields.includes("Comment");
  const hasCoordinates = fields.includes("Lat") && fields.includes("Lon");

  let rowCount = 0;
  const matchedCounties = new Set();
  const repeaterPoints = [];
  const seenAreaKeys = new Set();  // avoid duplicate "area" rows per county,
                                    // scoped to just THIS source/file --
                                    // two different loaded files are each
                                    // allowed their own "area" row for the
                                    // same county (they just both land in
                                    // csvLookup[key], same as an
                                    // intentional multiarea overlap would).

  for (const row of parsed.data) {
    let county, state, area, region, color, type;

    if (isChirpFormat) {
      const parsedLoc = parseCountyStateFromComment(row.Comment);
      if (!parsedLoc) continue;
      county = parsedLoc.county;
      state = parsedLoc.state;
      area = (row.Area || "").trim();
      region = (row.Region || "").trim();
      color = (row.Color || "#4287f5").trim();
      type = "area";
    } else {
      county = (row.county || "").trim();
      state = (row.state || "").trim();
      area = (row.area || "").trim();
      region = (row.region || "").trim();
      color = (row.color || "#4287f5").trim();
      type = (row.type || "area").trim().toLowerCase() === "multiarea"
        ? "multiarea" : "area";
    }

    if (!county || !state || !area) continue;

    const key = matchKey(county, state);
    const areaKey = key + "|" + area + "|" + type;
    if (type === "area") {
      if (seenAreaKeys.has(key + "|area")) continue;
      seenAreaKeys.add(key + "|area");
    } else if (seenAreaKeys.has(areaKey)) {
      continue;  // duplicate multiarea row for the same county+area
    } else {
      seenAreaKeys.add(areaKey);
    }

    if (!csvLookup[key]) csvLookup[key] = [];
    csvLookup[key].push({ area, region, color, type });
    matchedCounties.add(key);

    if (!regionAreaColors[region]) regionAreaColors[region] = {};
    regionAreaColors[region][area] = color;
    rowCount++;

    if (hasCoordinates) {
      const lat = parseFloat(row.Lat);
      const lon = parseFloat(row.Lon);
      if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
        repeaterPoints.push({
          lat, lon, area, region, color,
          name: row.Name || "",
          freq: row.Frequency || "",
        });
      }
    }
  }

  return { rowCount, matchedCounties, repeaterPoints, isChirpFormat, hasCoordinates };
}

// Re-parses and re-merges EVERY currently-loaded source from scratch --
// the simplest reliable way to support removing one source without
// disturbing the others (rather than trying to surgically un-merge just
// that source's rows out of a shared lookup).
function rebuildFromSources() {
  // Loading (or removing) a source changes what's actually on the map,
  // so any previous selection is cleared here -- otherwise a region you
  // selected earlier keeps everything ELSE (including whatever you just
  // loaded) faded down to near-invisible, since the fade-non-selected
  // styling in featureStyle() doesn't know a new region even exists yet.
  // Default view after any load is always "show everything loaded".
  selection = null;
  const clearBtn = document.getElementById("clear-selection-btn");
  if (clearBtn) clearBtn.style.display = "none";
  const banner = document.getElementById("selection-banner");
  if (banner) banner.classList.remove("open");

  csvLookup = {};
  regionAreaColors = {};
  let totalRows = 0;
  const totalMatched = new Set();
  let allRepeaterPoints = [];
  let anyCoords = false;

  for (const source of loadedSources) {
    const result = parseCsvIntoState(source.text);
    totalRows += result.rowCount;
    result.matchedCounties.forEach((k) => totalMatched.add(k));
    allRepeaterPoints = allRepeaterPoints.concat(result.repeaterPoints);
    if (result.hasCoordinates) anyCoords = true;
  }
  allRepeaterPointsCache = allRepeaterPoints;

  // Colors are now chosen by actual VISUAL distance, not just "is this
  // exact hex string already used" -- two dark, similarly-saturated
  // blues (like East TN's unified color and North AL's own individual
  // area color both happening to be dark navy) can be entirely
  // different hex STRINGS and still be nearly indistinguishable at a
  // glance, which is what let that pairing slip through the earlier,
  // exact-match-only version of this fix. Each region gets whichever
  // palette color is FARTHEST (in RGB space) from the single closest
  // color already in use by any area, multi-area, or previously
  // assigned region -- a greedy "most different from its nearest
  // neighbor" pick, not just "not identical to something else".
  const usedColors = [];
  for (const key in csvLookup) {
    for (const m of csvLookup[key]) usedColors.push(m.color);
  }
  regionColorByName = {};
  Object.keys(regionAreaColors).sort().forEach((region, idx) => {
    let best = REGION_COLOR_PALETTE[0];
    let bestMinDist = -1;
    for (const candidate of REGION_COLOR_PALETTE) {
      if (Object.values(regionColorByName).includes(candidate)) continue;
      let minDist = usedColors.length ? Infinity : 999;
      for (const used of usedColors) {
        const d = colorDistance(candidate, used);
        if (d < minDist) minDist = d;
      }
      if (minDist > bestMinDist) {
        bestMinDist = minDist;
        best = candidate;
      }
    }
    regionColorByName[region] = best;
    usedColors.push(best);  // so the NEXT region also avoids landing near this one
  });

  console.log("Loaded sources:", loadedSources.map((s) => s.name));
  console.log("Unique counties matched:", totalMatched.size, "from", totalRows, "rows");

  let statusText;
  if (loadedSources.length === 0) {
    statusText = "No CSV loaded yet.";
  } else {
    statusText = totalMatched.size + " unique counties loaded from " + totalRows +
      " row(s), across " + Object.keys(regionAreaColors).length + " region(s)" +
      (loadedSources.length > 1 ? " (" + loadedSources.length + " files loaded)." : ".");
    if (anyCoords) {
      statusText += " " + allRepeaterPoints.length + " repeater location(s) with GPS data.";
    }
  }
  document.getElementById("status").textContent = statusText;

  renderLoadedSourcesList();
  renderSidebarList();
  applyStyling();
  renderMultiAreaOutlines();
  renderRepeaterMarkers(allRepeaterPoints);
}

// Firestore write/read failures for the account-sync features (both
// currentSources and the explicit Saved Maps) used to only go to
// console.warn -- invisible unless someone had devtools open. The most
// common real-world cause is Firestore Security Rules that don't (yet)
// permit the path being written to, which fails silently from the
// person's point of view otherwise. Surfacing it on-page turns "maps
// aren't saving, I have no idea why" into an actual, readable error.
function showSyncError(action, e) {
  console.warn(action, e);
  const el = document.getElementById("sync-error-status");
  if (!el) return;
  const detail = (e && e.message) ? e.message : String(e);
  el.textContent = action + ": " + detail;
}

function clearSyncError() {
  const el = document.getElementById("sync-error-status");
  if (el) el.textContent = "";
}

// Wraps a Firestore promise so a HANGING request (rather than one that
// actively fails) still surfaces as a visible error after a timeout,
// instead of leaving something stuck on "(syncing...)" forever with no
// explanation. A genuine timeout here (as opposed to an immediate
// permission-denied) usually points at Firestore not being reachable at
// all -- e.g. no Cloud Firestore database created yet for the project
// (enabling Authentication does NOT create one automatically), or a
// network/ad-blocker issue blocking firestore.googleapis.com.
function withTimeout(promise, label, ms) {
  ms = ms || 15000;
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      reject(new Error(
        label + " timed out after " + Math.round(ms / 1000) + "s -- Firestore " +
        "may not be reachable. Check that a Cloud Firestore database has " +
        "actually been created for this project (Firebase console > " +
        "Firestore Database > Create database), and that nothing " +
        "(ad blocker, network) is blocking firestore.googleapis.com."));
    }, ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

// Adds one more CSV to the map alongside whatever's already loaded. name
// is just a display label (file name, or saved-map name) -- duplicates
// by name are allowed (e.g. re-picking the same file), each gets its own
// entry so it can be removed independently.
//
// While logged in, this ALSO mirrors the source into the account's
// "currentSources" collection in Firestore (separate from the
// explicitly-named Saved Maps list) -- that's what makes anything
// loaded show up automatically the next time this account is logged
// into, on any device, without the person having to save/reload it by
// name themselves. Logged out, it just stays local to this tab/session.
function addCsvSource(text, name) {
  const source = { id: "src" + (++sourceIdCounter), name, text, synced: false };
  loadedSources.push(source);
  rebuildFromSources();  // show it immediately, don't wait on the network

  if (currentUser) {
    withTimeout(currentSourcesCollection().add({
      name, text, savedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }), "Syncing '" + name + "'").then((docRef) => {
      source.id = docRef.id;
      source.synced = true;
      clearSyncError();
      renderLoadedSourcesList();  // refresh so its remove button's closure
                                   // uses the new (Firestore doc) id
    }).catch((e) => {
      source.syncFailed = true;
      showSyncError("Couldn't sync '" + name + "' to your account", e);
      renderLoadedSourcesList();  // drop the stuck "(syncing...)" label
    });
  }
}

function removeCsvSource(id) {
  const source = loadedSources.find((s) => s.id === id);
  loadedSources = loadedSources.filter((s) => s.id !== id);
  rebuildFromSources();

  if (currentUser && source && source.synced) {
    withTimeout(currentSourcesCollection().doc(id).delete(), "Removing '" + source.name + "'")
      .then(() => {
        clearSyncError();
      }).catch((e) => {
        showSyncError("Couldn't remove '" + source.name + "' from your account", e);
      });
  }
}

function clearAllCsvSources() {
  const toDelete = currentUser ? loadedSources.filter((s) => s.synced) : [];
  loadedSources = [];
  rebuildFromSources();

  if (currentUser && toDelete.length) {
    const batch = db.batch();
    toDelete.forEach((s) => batch.delete(currentSourcesCollection().doc(s.id)));
    withTimeout(batch.commit(), "Clearing your account's loaded files").then(() => {
      clearSyncError();
    }).catch((e) => {
      showSyncError("Couldn't clear your account's loaded files", e);
    });
  }
}

function renderLoadedSourcesList() {
  const container = document.getElementById("loaded-sources-list");
  const clearBtn = document.getElementById("clear-loaded-sources-btn");
  if (!container) return;
  container.innerHTML = "";

  if (loadedSources.length === 0) {
    clearBtn.style.display = "none";
    return;
  }
  clearBtn.style.display = loadedSources.length > 1 ? "block" : "none";

  for (const source of loadedSources) {
    const row = document.createElement("div");
    row.className = "saved-map-row";

    const label = document.createElement("span");
    label.className = "saved-map-name";
    let suffix = "";
    if (currentUser && !source.synced) {
      suffix = source.syncFailed ? " (not synced)" : " (syncing...)";
    }
    label.textContent = source.name + suffix;
    row.appendChild(label);

    const del = document.createElement("button");
    del.className = "saved-map-delete";
    del.textContent = "\u00d7";
    del.title = "Remove this file from the map";
    del.addEventListener("click", () => removeCsvSource(source.id));
    row.appendChild(del);

    container.appendChild(row);
  }
}

// Kept for compatibility -- a single CSV, replacing anything else that
// was loaded. Used for the "log in and it restores your last map" case;
// everywhere a person is actively picking files/maps now goes through
// addCsvSource() instead so multiple loads accumulate.
function loadCsvText(text, name) {
  loadedSources = [{ id: "src" + (++sourceIdCounter), name: name || "Loaded map", text }];
  rebuildFromSources();
}

// Which regions are collapsed in the sidebar -- persists across
// renderSidebarList() calls (new CSV loads, selection changes, etc.) so
// toggling a region open/shut doesn't get forgotten the next time
// anything on the map changes and the list re-renders.
let collapsedRegions = new Set();

function toggleRegionCollapsed(region) {
  if (collapsedRegions.has(region)) {
    collapsedRegions.delete(region);
  } else {
    collapsedRegions.add(region);
  }
  renderSidebarList();
}

function renderSidebarList() {
  const container = document.getElementById("region-list");
  container.innerHTML = "";

  for (const region of Object.keys(regionAreaColors).sort()) {
    const block = document.createElement("div");
    block.className = "region-block";

    const isCollapsed = collapsedRegions.has(region);
    const isRegionSelected = !!(selection && selection.type === "region" && selection.name === region);

    const header = document.createElement("div");
    header.className = "region-header" + (isRegionSelected ? " active" : "");

    const arrow = document.createElement("span");
    arrow.className = "region-arrow" + (isCollapsed ? " collapsed" : "");
    header.appendChild(arrow);

    const title = document.createElement("span");
    title.className = "region-title";
    title.textContent = region;
    header.appendChild(title);

    // Clicking the arrow just expands/collapses the list of areas.
    // Clicking anywhere else in the header row selects/zooms to the
    // region on the map (existing behavior) AND expands it if it was
    // collapsed -- seeing a region highlighted with its area list
    // hidden would be confusing. The select handler is on the whole
    // HEADER (not just the name text) so the tappable area is the full
    // row width -- a much easier touch target on a phone than just the
    // text glyphs.
    arrow.addEventListener("click", (evt) => {
      evt.stopPropagation();
      toggleRegionCollapsed(region);
    });
    header.addEventListener("click", () => {
      collapsedRegions.delete(region);  // selecting it should reveal its areas
      selectRegion(region);  // re-renders the sidebar itself
    });
    block.appendChild(header);

    const areasContainer = document.createElement("div");
    areasContainer.className = "region-areas" + (isCollapsed ? " collapsed" : "");

    const areas = regionAreaColors[region];
    for (const area of Object.keys(areas).sort()) {
      const row = document.createElement("div");
      row.className = "area-row";
      if (selection && selection.type === "area" && selection.name === area) {
        row.classList.add("active");
      }

      const swatch = document.createElement("div");
      swatch.className = "swatch";
      swatch.style.background = areas[area];
      row.appendChild(swatch);

      const label = document.createElement("span");
      label.textContent = area;
      row.appendChild(label);

      row.addEventListener("click", () => selectArea(area));
      areasContainer.appendChild(row);
    }
    block.appendChild(areasContainer);
    container.appendChild(block);
  }
}

function countyKeysForSelection(sel) {
  const keys = [];
  for (const key in csvLookup) {
    const matches = csvLookup[key];
    if (matches.some((m) =>
        (sel.type === "region" && m.region === sel.name) ||
        (sel.type === "area" && m.area === sel.name))) {
      keys.push(key);
    }
  }
  return keys;
}

function fitBoundsToSelection(sel) {
  if (!countiesLayer) return;
  const keys = new Set(countyKeysForSelection(sel));
  if (!keys.size) return;

  const bounds = new google.maps.LatLngBounds();
  let found = false;
  countiesLayer.forEach((feature) => {
    const stateFips = feature.getProperty("STATE");
    const countyName = feature.getProperty("NAME");
    const stateAbbr = FIPS_TO_STATE[stateFips];
    const key = matchKey(countyName, stateAbbr);
    if (!keys.has(key)) return;
    found = true;
    feature.getGeometry().forEachLatLng((latLng) => bounds.extend(latLng));
  });
  if (found) map.fitBounds(bounds);
}

// Finds which region an area belongs to by scanning the loaded data --
// used so the banner can show "Area — Region" together even when only
// the area name is known (e.g. from the location watch, which matches
// on area first).
function findRegionForArea(areaName) {
  for (const key in csvLookup) {
    const m = csvLookup[key].find((e) => e.area === areaName);
    if (m) return m.region;
  }
  return null;
}

function renderSelectionBanner() {
  const banner = document.getElementById("selection-banner");
  if (!selection) {
    banner.classList.remove("open");
    return;
  }
  let text;
  if (selection.type === "region") {
    text = "Region: " + selection.name;
  } else {
    const region = findRegionForArea(selection.name);
    text = selection.name + (region ? " \u2014 " + region : "");
  }
  document.getElementById("selection-banner-text").textContent = text;
  banner.classList.add("open");
}

function selectRegion(name) {
  selection = { type: "region", name };
  applyStyling();
  renderSidebarList();
  fitBoundsToSelection(selection);
  renderRepeaterMarkers();
  document.getElementById("clear-selection-btn").style.display = "inline-block";
  renderSelectionBanner();
  // Deliberately does NOT auto-close the sidebar on mobile like
  // selectArea() does -- tapping a region expands it to reveal its
  // areas (see the header click handler in renderSidebarList()), and
  // closing the drawer immediately would hide that list again before
  // there was any chance to see or tap into it. The region still zooms/
  // highlights on the map underneath; picking a specific AREA (or
  // tapping the dark overlay) is what actually dismisses the drawer.
}

function selectArea(name) {
  selection = { type: "area", name };
  applyStyling();
  renderSidebarList();
  fitBoundsToSelection(selection);
  renderRepeaterMarkers();
  document.getElementById("clear-selection-btn").style.display = "inline-block";
  renderSelectionBanner();
  if (window.innerWidth <= 700) closeSidebar();
}

function clearSelection() {
  selection = null;
  applyStyling();
  renderSidebarList();
  renderRepeaterMarkers();
  document.getElementById("clear-selection-btn").style.display = "none";
  renderSelectionBanner();
}

document.getElementById("clear-selection-btn").addEventListener("click", clearSelection);
document.getElementById("selection-banner-close").addEventListener("click", clearSelection);

document.getElementById("marker-toggle").addEventListener("change", (event) => {
  showMarkers = event.target.checked;
  renderRepeaterMarkers();
});

// Accounts + Saved Maps: real multi-user accounts via Firebase
// Authentication, with each user's saved CSV datasets stored in
// Firestore under their own account -- separate from anyone else's,
// and available on any device once logged in (unlike the old
// localStorage-only version, which was tied to one browser).

// SETUP REQUIRED: replace FIREBASE_CONFIG below with your own Firebase
// project's config (Firebase Console -> Project Settings -> your web
// app -> SDK setup and configuration). You'll also need to enable
// Email/Password sign-in under Authentication -> Sign-in method, and
// create a Firestore database (Build -> Firestore Database -> Create).
// ---------------------------------------------------------------------

  apiKey: "AIzaSyDWBndr3H7XgfW3EWX_s4r4q3MBUc98s3A",
  authDomain: "ham-area-tracker.firebaseapp.com",
  projectId: "ham-area-tracker",
  storageBucket: "ham-area-tracker.firebasestorage.app",

  measurementId: "G-RZ3847JLMN",
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

function showAuthError(message) {
  document.getElementById("auth-error").textContent = message || "";
}

document.getElementById("auth-signup-btn").addEventListener("click", () => {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  showAuthError("");
  if (!email || !password) {
    showAuthError("Enter an email and password first.");
    return;
  }
  auth.createUserWithEmailAndPassword(email, password)

});

document.getElementById("auth-login-btn").addEventListener("click", () => {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  showAuthError("");
  if (!email || !password) {
    showAuthError("Enter an email and password first.");
    return;
  }
  auth.signInWithEmailAndPassword(email, password)
    .catch((error) => showAuthError(error.message));
});

document.getElementById("auth-logout-btn").addEventListener("click", () => {
  auth.signOut();
});

auth.onAuthStateChanged((user) => {
  currentUser = user;
  const loggedOutEl = document.getElementById("auth-logged-out");
  const loggedInEl = document.getElementById("auth-logged-in");

  if (user) {
    loggedOutEl.style.display = "none";
    loggedInEl.style.display = "flex";
    document.getElementById("auth-user-email").textContent = user.email;
    document.getElementById("auth-user-email").title = user.email;
    showAuthError("");
    document.getElementById("auth-password").value = "";
    syncLocalSourcesToAccountAndLoad();
  } else {
    loggedOutEl.style.display = "block";
    loggedInEl.style.display = "none";
    // Logging out drops back to a blank, local-only session -- whatever
    // was loaded stays safely in the account's currentSources collection
    // (and comes right back on next login, here or on any other
    // device), it just isn't shown while logged out.
    loadedSources = [];
    rebuildFromSources();
  }

  renderSavedMapsList();
});

// Called right after logging in. Two things happen, in order:
// 1. Anything already loaded THIS session that isn't synced yet (loaded
//    before logging in) gets pushed up into the account.
// 2. The account's full currentSources collection becomes the new
//    loadedSources list -- this is what pulls in everything left loaded
//    from OTHER devices/sessions under this same account, so the map
//    ends up showing "everything this account currently has loaded,
//    from anywhere" rather than just what was already open here.
async function syncLocalSourcesToAccountAndLoad() {
  document.getElementById("status").textContent = "Loading your account's map data...";

  const unsynced = loadedSources.filter((s) => !s.synced);
  for (const s of unsynced) {
    try {
      const docRef = await withTimeout(currentSourcesCollection().add({
        name: s.name, text: s.text,
        savedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }), "Syncing '" + s.name + "'");
      s.id = docRef.id;
      s.synced = true;
    } catch (e) {
      s.syncFailed = true;
      showSyncError("Couldn't sync '" + s.name + "' to your account", e);
    }
  }

  try {
    const snapshot = await withTimeout(
      currentSourcesCollection().orderBy("savedAt", "asc").get(),
      "Loading your account's map data");
    loadedSources = snapshot.docs.map((doc) => ({
      id: doc.id, name: doc.data().name, text: doc.data().text, synced: true,
    }));
    clearSyncError();
  } catch (e) {
    showSyncError("Couldn't load your account's saved map data", e);
  }
  rebuildFromSources();
  renderSavedMapsList();  // refreshes "active" highlighting now that
                           // loadedSources reflects the account's data
}

function currentSourcesCollection() {
  return db.collection("users").doc(currentUser.uid).collection("currentSources");
}

function savedMapsCollection() {
  return db.collection("users").doc(currentUser.uid).collection("savedMaps");
}

async function saveCurrentMap(name, csvText) {
  if (!currentUser) {
    alert("Log in or sign up first to save maps to your account.");
    return;
  }
  try {
    await withTimeout(savedMapsCollection().doc(name).set({
      csvText,
      savedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }), "Saving '" + name + "'");
    clearSyncError();
  } catch (e) {
    showSyncError("Couldn't save '" + name + "' to your account", e);
  }
  renderSavedMapsList();
}

async function loadSavedMap(name) {
  if (!currentUser) return;
  try {
    const doc = await withTimeout(savedMapsCollection().doc(name).get(), "Loading '" + name + "'");
    if (!doc.exists) return;
    addCsvSource(doc.data().csvText, name);
    clearSyncError();
  } catch (e) {
    showSyncError("Couldn't load '" + name + "' from your account", e);
  }
  renderSavedMapsList();
}

async function deleteSavedMap(name) {
  if (!currentUser) return;
  if (!confirm("Delete saved map \"" + name + "\"? This can't be undone.")) return;
  try {
    await withTimeout(savedMapsCollection().doc(name).delete(), "Deleting '" + name + "'");
    clearSyncError();
  } catch (e) {
    showSyncError("Couldn't delete '" + name + "' from your account", e);
  }
  renderSavedMapsList();
}

// Guards against a duplicate-rows race: renderSavedMapsList() gets
// called from several places (login, save, load, delete) and each one
// awaits a Firestore round-trip before it can rebuild the list. If two
// calls overlap, the container gets cleared once but appended to twice
// -- whichever call resolves LAST wins and is the only one allowed to
// actually touch the DOM; a stale, superseded call just discards its
// results instead of appending duplicate rows on top.
let savedMapsRenderToken = 0;

async function renderSavedMapsList() {
  const myToken = ++savedMapsRenderToken;
  const container = document.getElementById("saved-maps-list");

  if (!currentUser) {
    if (myToken !== savedMapsRenderToken) return;
    container.innerHTML = "";
    const empty = document.createElement("div");
    empty.id = "no-saved-maps";
    empty.textContent = "Log in to save and load maps tied to your account.";
    container.appendChild(empty);
    return;
  }

  let snapshot;
  try {
    snapshot = await withTimeout(
      savedMapsCollection().orderBy("savedAt", "desc").get(),
      "Loading your saved maps list");
    clearSyncError();
  } catch (e) {
    showSyncError("Couldn't load your saved maps list", e);
    if (myToken !== savedMapsRenderToken) return;
    container.innerHTML = "";
    const errEl = document.createElement("div");
    errEl.id = "no-saved-maps";
    errEl.textContent = "Couldn't load saved maps -- see error above.";
    container.appendChild(errEl);
    return;
  }
  if (myToken !== savedMapsRenderToken) return;  // a newer call has since started -- don't render stale results
  container.innerHTML = "";

  if (snapshot.empty) {
    const empty = document.createElement("div");
    empty.id = "no-saved-maps";
    empty.textContent = "No saved maps yet -- load a CSV to save one.";
    container.appendChild(empty);
    return;
  }

  snapshot.forEach((doc) => {
    const name = doc.id;
    const data = doc.data();
    const row = document.createElement("div");
    row.className = "saved-map-row" +
      (loadedSources.some((s) => s.name === name) ? " active" : "");

    const label = document.createElement("span");
    label.className = "saved-map-name";
    label.textContent = name;
    if (data.savedAt) {
      label.title = "Saved " + data.savedAt.toDate().toLocaleString();
    }
    label.addEventListener("click", () => loadSavedMap(name));
    row.appendChild(label);

    const del = document.createElement("button");
    del.className = "saved-map-delete";
    del.textContent = "\u00d7";
    del.title = "Delete this saved map";
    del.addEventListener("click", (evt) => {
      evt.stopPropagation();
      deleteSavedMap(name);
    });
    row.appendChild(del);

    container.appendChild(row);
  });
}

document.getElementById("clear-loaded-sources-btn").addEventListener("click", () => {
  if (confirm("Remove all loaded CSV files from the map?")) clearAllCsvSources();
});

document.getElementById("csv-file").addEventListener("change", (event) => {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;

  // A single file keeps the old behavior (optionally prompting to save
  // it to your account). Picking several at once just loads them all
  // alongside anything already on the map -- prompting to save each one
  // individually would mean a popup per file, so multi-select skips the
  // save-to-account prompt; save any of them individually afterward via
  // a single-file pick if you want it in your saved maps list.
  if (files.length === 1) {
    const file = files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      const csvText = e.target.result;
      const defaultName = file.name.replace(/\.csv$/i, "");
      if (!currentUser) {
        addCsvSource(csvText, defaultName);
        return;
      }
      const name = prompt("Save this map as:", defaultName);
      if (name === null) {
        addCsvSource(csvText, defaultName);
        return;
      }
      saveCurrentMap(name.trim() || defaultName, csvText);
      addCsvSource(csvText, name.trim() || defaultName);
    };
    reader.readAsText(file);
    return;
  }

  for (const file of files) {
    const reader = new FileReader();
    reader.onload = (e) => {
      addCsvSource(e.target.result, file.name.replace(/\.csv$/i, ""));
    };
    reader.readAsText(file);
  }
});
